# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if (Test-Path "client\requirements.txt") { pip install -r client\requirements.txt }
    - name: Lint with flake8
      run: |
        flake8 client/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 server/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test Pyinstaller Compilation
      run: |
        pip install pyinstaller 
        pyinstaller client\active-status.spec
        if (!(Test-Path "client\dist\active-status.exe")) { exit 1 }
        pyinstaller server\active-status-daemon.spec
        if (!(Test-Path "server\dist\active-status-daemon.exe")) { exit 1 }
      shell: pwsh
        