name: Rust

on:
  push:
    branches:
      -  main
  #Only run when Rust files change
    paths:
      - 'client/tools/pgsql-connect-check/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
